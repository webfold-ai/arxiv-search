[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = [
  # ttf-parser is unmaintained with no safe upgrade; it reaches us only via
  # pdf-inspector -> lopdf for PDF text extraction. Revisit if pdf-inspector
  # moves to skrifa or another maintained font parser.
  { id = "RUSTSEC-2026-0192", reason = "transitive via pdf-inspector/lopdf; no upgrade available" },
  # chrono: RUSTSEC-2026-0543 (2026-09-14), informational "unmaintained", `patched = []`, all versions affected
  # (https://github.com/chronotope/chrono/issues/1768); the advisory names jiff or time as alternatives.
  # Impact: no vulnerability, a maintenance-status notice. chrono is required by lopdf 0.45 (via pdf-inspector),
  # by rmcp 3.11 and by schemars 1.x (rmcp's chrono04 feature); none has a chrono-free release, so it cannot be
  # replaced from this repository. Added 2026-11-22. Remove when lopdf, rmcp and schemars drop chrono (or
  # RustSec marks a patched release): `cargo tree -i chrono` is the check.
  { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained, no patched version; required by lopdf, rmcp and schemars (dated 2026-11-22)" },
]

[licenses]
version = 2
allow = [
  "Apache-2.0",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.8

# Narrow, per-crate exceptions rather than allowing these licenses globally.
[[licenses.exceptions]]
# Mozilla's CA root list, bundled by rustls via reqwest.
crate = "webpki-roots"
allow = ["CDLA-Permissive-2.0"]

[[licenses.exceptions]]
# File-level weak copyleft; pulled in by directories -> dirs-sys.
crate = "option-ext"
allow = ["MPL-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
  "https://github.com/firecrawl/pdf-inspector",
  # pdf-inspector pins lopdf to a git revision.
  "https://github.com/J-F-Liu/lopdf",
]
