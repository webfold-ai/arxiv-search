[package]
name = "arxiv-search-rs-mcp-core"
version.workspace = true
edition.workspace = true
license.workspace = true
# Not published: core depends on a git crate, which crates.io rejects.
publish = false
description = "Core logic for arxiv-search-rs-mcp (no I/O)"

[lints]
workspace = true

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.41"
htmd = "0.5"
pdf-inspector = { git = "https://github.com/firecrawl/pdf-inspector", rev = "2e490045545f842167f2af52331ef55ab77b9819" }
async-trait = "0.1.89"
